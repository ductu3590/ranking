<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f0effa" />
    <title>PickHub — Brand & UI Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#preview-root">Bỏ qua thanh điều hướng</a>
    <header class="preview-toolbar">
      <div class="preview-brand">
        <span class="brand-mark brand-mark--small" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M14 34V14h11.8c5.8 0 9.7 3 9.7 8.1s-3.9 8.1-9.7 8.1h-5.1" />
            <path d="M21 22.1h4.2c1.7 0 2.8-.8 2.8-2s-1.1-2-2.8-2H21" />
            <circle cx="34.5" cy="34" r="4.3" />
          </svg>
        </span>
        <span>
          <strong>PickHub</strong>
          <small>Brand & UI preview</small>
        </span>
      </div>
      <div class="preview-context" role="group" aria-label="Chọn ngữ cảnh xem trước">
        <span class="preview-context__label">Xem trước</span>
        <button class="context-button is-active" type="button" data-view="member">Thành viên</button>
        <button class="context-button" type="button" data-view="leader">Trưởng nhóm</button>
        <button class="context-button" type="button" data-view="public">Trang giải</button>
      </div>
      <div class="preview-note"><span class="status-dot"></span> Dữ liệu minh hoạ</div>
    </header>

    <main id="preview-root" tabindex="-1"></main>

    <script src="./app.js" defer></script>
  </body>
</html>
