<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Link mời dành cho CLB khác (Mobile 390px) | PickHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              purple: '#7c3aed',
              'purple-hover': '#6d28d9',
              'purple-light': '#f5f3ff',
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen py-10 flex flex-col items-center justify-start antialiased selection:bg-purple-100 selection:text-purple-700">

  <!-- Mobile 390px Column (Natural height, no phone frame, no inner scroll container) -->
  <main class="w-[390px] max-w-full flex flex-col">

    <!-- Top Bar -->
    <header class="h-14 bg-white border border-slate-200 rounded-t-2xl px-4 flex items-center justify-between shadow-sm">
      <!-- Hamburger Icon (Inline SVG) -->
      <button type="button" aria-label="Menu" class="w-10 h-10 -ml-1 flex items-center justify-center text-slate-700 hover:text-slate-900 active:scale-95 transition-transform">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>

      <!-- Brand Wordmark -->
      <div class="flex items-center gap-1.5">
        <div class="w-7 h-7 rounded-lg bg-[#7c3aed] flex items-center justify-center text-white shadow-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="9" cy="10" r="1.25" fill="currentColor"></circle>
            <circle cx="15" cy="10" r="1.25" fill="currentColor"></circle>
            <circle cx="12" cy="14" r="1.25" fill="currentColor"></circle>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-[#7c3aed]">PickHub</span>
      </div>

      <!-- Bell Icon (Inline SVG) -->
      <button type="button" aria-label="Thông báo" class="w-10 h-10 -mr-1 flex items-center justify-center text-slate-700 hover:text-slate-900 relative active:scale-95 transition-transform">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
    </header>

    <!-- Main Content Container with slate-200 border continuation -->
    <div class="bg-slate-50 border-x border-b border-slate-200 rounded-b-2xl p-4 pt-8 pb-10 flex flex-col items-center">

      <!-- White Card with 1px slate-200 border, rounded-xl -->
      <section class="w-full bg-white border border-slate-200 rounded-xl p-6 shadow-sm flex flex-col items-center text-center">
        
        <!-- 64px circle (slate-100) with a lock icon in slate-500 -->
        <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mb-5 text-slate-500">
          <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>

        <!-- Title: 18px bold -->
        <h1 class="text-[18px] leading-snug font-bold text-slate-900 mb-2">
          Link mời này dành cho một CLB khác
        </h1>

        <!-- Body slate-600 -->
        <p class="text-[14px] leading-relaxed text-slate-600 mb-6">
          Bạn đang đăng nhập: <span class="font-semibold text-slate-800">CLB Test 23.9.2026</span>
        </p>

        <!-- Action Buttons Container -->
        <div class="w-full flex flex-col gap-3">
          <!-- Primary Purple Full-width Button (≥44px tall) -->
          <button type="button" class="w-full min-h-[46px] px-4 py-3 bg-[#7c3aed] hover:bg-[#6d28d9] active:bg-[#5b21b6] text-white text-[15px] font-semibold rounded-xl flex items-center justify-center gap-2 shadow-sm transition-colors active:scale-[0.99]">
            <svg class="w-4 h-4 text-purple-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Đăng xuất &amp; đăng nhập CLB khác</span>
          </button>

          <!-- Secondary Outlined Full-width Button (≥44px tall) -->
          <button type="button" class="w-full min-h-[46px] px-4 py-3 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 hover:text-slate-900 text-[15px] font-semibold border border-slate-300 rounded-xl flex items-center justify-center gap-2 transition-colors active:scale-[0.99]">
            <svg class="w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Về trang chủ</span>
          </button>
        </div>

      </section>

      <!-- Small slate-500 hint below the card -->
      <div class="mt-4 px-3 flex items-start justify-center gap-1.5 text-center">
        <svg class="w-4 h-4 text-slate-400 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <p class="text-[13px] leading-normal text-slate-500">
          Nhờ chủ nhà gửi lại link nếu bạn quản trị CLB được mời.
        </p>
      </div>

    </div>

  </main>

</body>
</html>
