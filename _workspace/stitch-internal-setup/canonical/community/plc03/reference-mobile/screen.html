<!DOCTYPE html><html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLC-03 Đăng nhập VĐV PickHub Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#7c3aed',
              hover: '#6d28d9',
              light: '#f5f3ff',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-container {
      width: 390px;
      min-width: 390px;
      max-width: 390px;
      background-color: #f8fafc;
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">
  <div class="mobile-container pb-8">
    <!-- Top Navigation Bar -->
    <header class="w-full bg-white border-b border-[#e2e8f0] px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <!-- PickHub Logo SVG -->
        <div class="flex items-center gap-1.5">
          <svg class="w-6 h-6 text-[#7c3aed]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 3a9 9 0 0 1 9 9"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span class="text-lg font-bold tracking-tight text-[#7c3aed]">PickHub</span>
        </div>
        <!-- Badge -->
        <span class="px-2 py-0.5 text-[11px] font-medium text-slate-600 bg-slate-100 rounded-full border border-slate-200">
          Giải cộng đồng
        </span>
      </div>
      <!-- Secondary Action Outline Button -->
      <a href="#" class="px-2.5 py-1 text-xs font-semibold text-slate-700 bg-white border border-[#e2e8f0] rounded-lg hover:bg-slate-50 transition-colors">
        Tạo tài khoản
      </a>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4">
      <!-- Main Card: Login Form with Error State -->
      <div class="bg-white rounded-2xl border border-[#e2e8f0] p-4 shadow-sm">
        <!-- Tabs -->
        <div class="flex border-b border-[#e2e8f0] mb-5">
          <button type="button" class="pb-2.5 px-3 text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">
            Tạo tài khoản
          </button>
          <button type="button" class="pb-2.5 px-3 text-sm font-bold text-[#7c3aed] border-b-2 border-[#7c3aed] -mb-[1px]">
            Đăng nhập
          </button>
        </div>

        <!-- Heading -->
        <div class="mb-4">
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">Đăng nhập</h1>
          <p class="text-xs text-slate-500 mt-1">Đăng nhập để đăng ký giải và xem đơn của bạn</p>
        </div>

        <!-- Error Alert Bar -->
        <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200/80 flex items-center gap-2.5 text-red-600 text-xs font-medium">
          <svg class="w-4 h-4 flex-shrink-0 text-red-500" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
          </svg>
          <span>Số điện thoại hoặc mật khẩu không đúng.</span>
        </div>

        <!-- Form Fields -->
        <form class="space-y-3.5" onsubmit="return false;">
          <!-- Phone Field -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Số điện thoại</label>
            <div class="relative">
              <input type="tel" value="0912 345 678" class="w-full h-11 px-3.5 rounded-xl border border-red-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#7c3aed]/20 focus:border-[#7c3aed] transition-colors">
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Mật khẩu</label>
            <div class="relative flex items-center">
              <input type="password" value="MatKhauSai123" class="w-full h-11 pl-3.5 pr-14 rounded-xl border border-red-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#7c3aed]/20 focus:border-[#7c3aed] transition-colors tracking-widest">
              <button type="button" class="absolute right-3 text-xs font-semibold text-[#7c3aed] hover:text-[#6d28d9] select-none">
                Hiện
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-1">
            <button type="submit" class="w-full h-12 bg-[#7c3aed] hover:bg-[#6d28d9] text-white font-semibold text-sm rounded-xl transition-colors shadow-sm flex items-center justify-center active:scale-[0.99]">
              Đăng nhập
            </button>
          </div>
        </form>

        <!-- Secondary Links -->
        <div class="mt-4 pt-1 text-center space-y-2">
          <p class="text-xs text-slate-600">
            Chưa có tài khoản? 
            <a href="#" class="font-semibold text-[#7c3aed] hover:underline">Tạo tài khoản</a>
          </p>
          <p class="text-[11px] text-slate-400 leading-relaxed">
            Quên mật khẩu? Liên hệ ban tổ chức giải để được đặt lại.
          </p>
        </div>
      </div>

      <!-- Second Card: Rate Limit Status Block -->
      <div class="bg-white rounded-2xl border border-[#e2e8f0] p-4 shadow-sm">
        <div class="text-[11px] font-bold tracking-wider text-slate-500 uppercase mb-3">
          TRẠNG THÁI GIỚI HẠN
        </div>

        <!-- Warning Alert Bar -->
        <div class="mb-3.5 p-3 rounded-xl bg-amber-50 border border-amber-200/80 flex items-start gap-2.5 text-amber-800 text-xs font-medium">
          <svg class="w-4 h-4 flex-shrink-0 text-amber-500 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
          </svg>
          <span class="leading-snug">Bạn thử quá nhiều lần. Vui lòng thử lại sau 4 phút.</span>
        </div>

        <!-- Disabled Button -->
        <button type="button" disabled="" class="w-full h-11 bg-slate-100 text-slate-400 font-semibold text-sm rounded-xl cursor-not-allowed flex items-center justify-center border border-slate-200">
          Đăng nhập
        </button>
      </div>
    </main>
  </div>

</body></html>
